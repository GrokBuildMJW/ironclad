<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc"><title id="title">Claude exact model overlays and templates</title><desc id="desc">Claude exact model overlays select xhigh effort and role templates. Native skill packages are separate. Coding returns a diff; the engine applies it.</desc>
