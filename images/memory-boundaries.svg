<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="t d"><title id="t">MEMORY ≠ PROCESS AUTHORITY</title><desc id="d">Knowledge tiers and storage substrates are independent axes.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#3A95AB" stroke-width="1.5"/></marker></defs><rect width="1440" height="800" rx="24" fill="#141414"/><g font-family="ui-monospace, SFMono-Regular, Consolas, monospace"><text x="64" y="76" fill="#7AA2F7" font-size="32" font-weight="600">MEMORY ≠ PROCESS AUTHORITY</text><text x="64" y="117" fill="#A3A3A3" font-size="20">Knowledge tiers and storage substrates are independent axes.</text><rect x="64" y="193" width="400" height="164" rx="14" fill="#2C2C2C" stroke="#363636"/><rect x="64" y="207" width="3" height="136" fill="#3A95AB"/><text x="88" y="231" fill="#C8C8C8" font-size="23" font-weight="600">T0 · EPISODES</text><text x="88" y="268" fill="#A3A3A3" font-size="19">Raw project material</text><text x="88" y="298" fill="#A3A3A3" font-size="19">Unapproved knowledge</text><path d="M464 275L499 275" stroke="#3A95AB" stroke-width="2.5" marker-end="url(#a)" fill="none"/><rect x="519" y="193" width="400" height="164" rx="14" fill="#2C2C2C" stroke="#363636"/><rect x="519" y="207" width="3" height="136" fill="#3A95AB"/><text x="543" y="231" fill="#C8C8C8" font-size="23" font-weight="600">T1 · LESSONS</text><text x="543" y="268" fill="#A3A3A3" font-size="19">Exact candidate approved</text><text x="543" y="298" fill="#A3A3A3" font-size="19">Project-scoped guidance</text><path d="M919 275L954 275" stroke="#3A95AB" stroke-width="2.5" marker-end="url(#a)" fill="none"/><rect x="974" y="193" width="400" height="164" rx="14" fill="#2C2C2C" stroke="#363636"/><rect x="974" y="207" width="3" height="136" fill="#3A95AB"/><text x="998" y="231" fill="#C8C8C8" font-size="23" font-weight="600">T2 · KNOWLEDGE</text><text x="998" y="268" fill="#A3A3A3" font-size="19">Approved + redacted</text><text x="998" y="298" fill="#A3A3A3" font-size="19">Project or released global</text><text x="482" y="400" text-anchor="middle" fill="#7AA2F7" font-size="21">APPROVAL</text><text x="937" y="400" text-anchor="middle" fill="#7AA2F7" font-size="21">APPROVAL + REDACTION</text><rect x="64" y="477" width="604" height="165" rx="14" fill="#2C2C2C" stroke="#363636"/><rect x="64" y="491" width="3" height="137" fill="#3A95AB"/><text x="88" y="515" fill="#C8C8C8" font-size="23" font-weight="600">RETRIEVAL → PROPOSAL</text><text x="88" y="552" fill="#A3A3A3" font-size="19">Hot / warm / cold is a storage axis</text><text x="88" y="582" fill="#A3A3A3" font-size="19">Memory remains advisory</text><rect x="768" y="477" width="608" height="165" rx="14" fill="#2C2C2C" stroke="#363636"/><rect x="768" y="491" width="3" height="137" fill="#7AA2F7"/><text x="792" y="515" fill="#C8C8C8" font-size="23" font-weight="600">PROCESS TRANSITION</text><text x="792" y="552" fill="#A3A3A3" font-size="19">Committed Event Log + pinned definition</text><text x="792" y="582" fill="#A3A3A3" font-size="19">Configured gates own routing</text><path d="M716 470V655" stroke="#363636" stroke-width="2" stroke-dasharray="7 8"/><text x="721" y="711" text-anchor="middle" fill="#A3A3A3" font-size="22">Knowledge promotion grants no process authority.</text></g></svg>