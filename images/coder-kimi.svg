<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc"><title id="title">Kimi verifier overlays and plan agent invocation</title><desc id="desc">Shipped Kimi agents are verifiers with rereview templates. Base overlays mention coding but do not supply a shipped coding route.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9" fill="#3A95AB" /></marker></defs>
<rect width="1440" height="850" fill="#141414" />
<text x="50" y="65" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="600">Kimi: headless review verification</text>
<text x="50" y="104" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400">Shipped verifier routes · exact rereview templates · no effort argv extra</text>
<rect x="50" y="145" width="654" height="151" rx="14" fill="#2C2C2C" stroke="#363636" stroke-width="2" />
<text x="72" y="185" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="600">kimi-k3</text>
<text x="72" y="223" fill="#C8C8C8" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400">Exact role: review_of_review</text>
<text x="72" y="264" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="400">Goal / constraints / completion</text>
<rect x="736" y="145" width="654" height="151" rx="14" fill="#2C2C2C" stroke="#363636" stroke-width="2" />
<text x="758" y="185" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="600">kimi-k2.5</text>
<text x="758" y="223" fill="#C8C8C8" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400">Exact role: review_of_review</text>
<text x="758" y="264" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="400">Criteria / tests / citation checklist</text>
<rect x="50" y="320" width="1340" height="135" rx="14" fill="#2C2C2C" stroke="#363636" stroke-width="2" />
<text x="72" y="359" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600">Native CLI dispatch · prompt in argv</text>
<text x="72" y="401" fill="#C8C8C8" font-family="DejaVu Sans Mono,monospace" font-size="24" font-weight="400">--model … --agent plan --output-format text --prompt …</text>
<text x="72" y="434" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400">Use the plan agent; prompt mode rejects --plan / --yolo / --auto combinations.</text>
<rect x="50" y="485" width="242" height="88" rx="14" fill="#2C2C2C" stroke="#363636" stroke-width="2" />
<text x="70" y="520" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Exact overlay</text>
<text x="70" y="550" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400">K3 or K2.5</text>
<path d="M298,529.0 L318,529.0" fill="none" stroke="#3A95AB" stroke-width="3" marker-end="url(#arrow)" />
<rect x="324" y="485" width="242" height="88" rx="14" fill="#2C2C2C" stroke="#363636" stroke-width="2" />
<text x="344" y="520" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Rereview template</text>
<text x="344" y="550" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400">same task + evidence</text>
<path d="M572,529.0 L592,529.0" fill="none" stroke="#3A95AB" stroke-width="3" marker-end="url(#arrow)" />
<rect x="598" y="485" width="242" height="88" rx="14" fill="#2C2C2C" stroke="#363636" stroke-width="2" />
<text x="618" y="520" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Kimi CLI</text>
<text x="618" y="550" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400">plan agent profile</text>
<path d="M846,529.0 L866,529.0" fill="none" stroke="#3A95AB" stroke-width="3" marker-end="url(#arrow)" />
<rect x="872" y="485" width="242" height="88" rx="14" fill="#2C2C2C" stroke="#363636" stroke-width="2" />
<text x="892" y="520" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Plain stdout</text>
<text x="892" y="550" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400">one verdict body</text>
<path d="M1120,529.0 L1140,529.0" fill="none" stroke="#3A95AB" stroke-width="3" marker-end="url(#arrow)" />
<rect x="1146" y="485" width="242" height="88" rx="14" fill="#2C2C2C" stroke="#363636" stroke-width="2" />
<text x="1166" y="513.0" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Engine validates</text>
<text x="1166" y="550.0" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400">approve / findings</text>
<rect x="50" y="605" width="648" height="194" rx="14" fill="#2C2C2C" stroke="#363636" stroke-width="2" />
<text x="72" y="645" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="600">Declared steering ≠ shipped route</text>
<text x="72" y="685" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="400">Base overlays mention coding and rereview.</text>
<text x="72" y="719" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="400">Shipped Kimi agents have verifier capability.</text>
<text x="72" y="753" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="400">Only rereview templates are packaged.</text>
<rect x="724" y="605" width="666" height="194" rx="14" fill="#2C2C2C" stroke="#363636" stroke-width="2" />
<text x="746" y="645" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="600">Separate native skill package</text>
<text x="746" y="685" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="400">.kimi-code/skills/&lt;name&gt;/SKILL.md</text>
<text x="746" y="719" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="400">whenToUse + disableModelInvocation</text>
<text x="746" y="753" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="400">Installed for invocation; engine owns cleanup.</text>
</svg>