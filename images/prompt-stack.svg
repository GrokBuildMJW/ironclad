<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc"><title id="title">Ironclad CLI prompt composition</title><desc id="desc">Seven ordered prompt layers are composed for one CLI invocation. A native skill package is installed separately and is not a seat template.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9" fill="#3A95AB"/></marker></defs>
<rect width="1440" height="850" fill="#141414"/>
<text x="50" y="65" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="600">One invocation. Seven prompt layers.</text>
<text x="50" y="104" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400">Exact model identity selects steering; the engine owns mutation and evidence.</text>
<rect x="50" y="145" width="950" height="74" rx="14" fill="#2C2C2C" stroke="#363636" stroke-width="2"/>
<text x="70" y="189" fill="#3A95AB" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600">1</text>
<text x="108" y="174" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Model / role overlay</text>
<text x="108" y="202" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400">Exact model steering; effort comes from the same declaration.</text>
<path d="M70,223 L70,229" fill="none" stroke="#3A95AB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="50" y="233" width="950" height="74" rx="14" fill="#2C2C2C" stroke="#363636" stroke-width="2"/>
<text x="70" y="277" fill="#3A95AB" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600">2</text>
<text x="108" y="262" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Seat template</text>
<text x="108" y="290" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400">Exact model + explicit role; omitted role uses the base overlay.</text>
<path d="M70,311 L70,317" fill="none" stroke="#3A95AB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="50" y="321" width="950" height="74" rx="14" fill="#2C2C2C" stroke="#363636" stroke-width="2"/>
<text x="70" y="365" fill="#3A95AB" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600">3</text>
<text x="108" y="350" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Calibration guidance</text>
<text x="108" y="378" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400">Optional addendum for the same complete model identity.</text>
<path d="M70,399 L70,405" fill="none" stroke="#3A95AB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="50" y="409" width="950" height="74" rx="14" fill="#2C2C2C" stroke="#363636" stroke-width="2"/>
<text x="70" y="453" fill="#3A95AB" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600">4</text>
<text x="108" y="438" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Operation contract</text>
<text x="108" y="466" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400">Permissions, operation policy and completion criteria.</text>
<path d="M70,487 L70,493" fill="none" stroke="#3A95AB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="50" y="497" width="950" height="74" rx="14" fill="#2C2C2C" stroke="#363636" stroke-width="2"/>
<text x="70" y="541" fill="#3A95AB" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600">5</text>
<text x="108" y="526" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Advisory references</text>
<text x="108" y="554" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400">Eligible lessons, then playbooks; identity-filtered and fenced.</text>
<path d="M70,575 L70,581" fill="none" stroke="#3A95AB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="50" y="585" width="950" height="74" rx="14" fill="#2C2C2C" stroke="#363636" stroke-width="2"/>
<text x="70" y="629" fill="#3A95AB" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600">6</text>
<text x="108" y="614" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Assignment</text>
<text x="108" y="642" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400">The original task, selected skill and supplied task references.</text>
<path d="M70,663 L70,669" fill="none" stroke="#3A95AB" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="50" y="673" width="950" height="74" rx="14" fill="#2C2C2C" stroke="#363636" stroke-width="2"/>
<text x="70" y="717" fill="#3A95AB" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600">7</text>
<text x="108" y="702" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Judgment command</text>
<text x="108" y="730" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400">Optional, advisory; enabled for eligible Claude review seats.</text>
<rect x="1040" y="145" width="350" height="284" rx="14" fill="#2C2C2C" stroke="#363636" stroke-width="2"/>
<text x="1062" y="184" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="600">Native skill package</text>
<text x="1062" y="226" fill="#C8C8C8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400">Canonical SKILL.md</text>
<text x="1062" y="262" fill="#C8C8C8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400">→ native metadata</text>
<text x="1062" y="298" fill="#C8C8C8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400">→ discovery directory</text>
<text x="1062" y="334" fill="#C8C8C8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400">→ one CLI invocation</text>
<text x="1062" y="370" fill="#C8C8C8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400">→ cleanup</text>
<rect x="1040" y="451" width="350" height="212" rx="14" fill="#2C2C2C" stroke="#363636" stroke-width="2"/>
<text x="1062" y="490" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600">Separate responsibilities</text>
<text x="1062" y="533" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400">Overlay: model steering</text>
<text x="1062" y="565" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400">Template: role contract</text>
<text x="1062" y="597" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400">Skill: reusable procedure</text>
<text x="1062" y="629" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400">Calibration: guidance</text>
<text x="50" y="822" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400">Availability is separate: CLI inventory + profile + exact identity + admitted role.</text>
</svg>