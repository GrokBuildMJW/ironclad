<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">One engine. Three model transports.</title>
<desc id="desc">The product owns contracts, approvals, evidence and application. Profiles and harnesses select model transport.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3A95AB"/></marker></defs>
<rect width="1440" height="860" fill="#141414"/>
<text x="60" y="68" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="700" fill="#7AA2F7" text-anchor="start">One engine. Three model transports.</text>
<text x="60" y="110" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#828282" text-anchor="start">The product owns contracts, approvals, evidence and application. Profiles and harnesses select model transport.</text>
<rect x="60" y="164" width="320" height="126" rx="16" fill="#2C2C2C" stroke="#363636" stroke-width="2"/>
<text x="84" y="202" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="650" fill="#7AA2F7" text-anchor="start">Operator + clients</text>
<text x="84" y="238" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#C8C8C8" text-anchor="start">CLI / API requests</text>
<text x="84" y="266" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#C8C8C8" text-anchor="start">Approvals and instructions</text>
<rect x="60" y="334" width="320" height="394" rx="16" fill="#2C2C2C" stroke="#363636" stroke-width="2"/>
<text x="84" y="372" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="650" fill="#7AA2F7" text-anchor="start">Process engine</text>
<text x="84" y="408" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#C8C8C8" text-anchor="start">Pinned process + config</text>
<text x="84" y="436" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#C8C8C8" text-anchor="start">TaskContract admission</text>
<text x="84" y="464" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#C8C8C8" text-anchor="start">Artifact and task ports</text>
<text x="84" y="492" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#C8C8C8" text-anchor="start">Registry routing</text>
<text x="84" y="520" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#C8C8C8" text-anchor="start">Review + reroutes</text>
<text x="84" y="548" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#C8C8C8" text-anchor="start">Tool authority</text>
<text x="84" y="576" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#C8C8C8" text-anchor="start">Diff application + checks</text>
<text x="84" y="604" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#C8C8C8" text-anchor="start">Go-live + change receipt</text>
<rect x="438" y="164" width="942" height="126" rx="16" fill="#2C2C2C" stroke="#363636" stroke-width="2"/>
<text x="462" y="202" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="650" fill="#7AA2F7" text-anchor="start">Durable shared truth</text>
<text x="462" y="238" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#C8C8C8" text-anchor="start">Event log: decisions, reservations, commits and receipts</text>
<text x="462" y="266" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#C8C8C8" text-anchor="start">Vault: immutable artifacts referenced by committed events</text>
<rect x="438" y="334" width="500" height="112" rx="16" fill="#2C2C2C" stroke="#363636" stroke-width="2"/>
<text x="462" y="372" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="650" fill="#C8C8C8" text-anchor="start">API model path</text>
<text x="462" y="408" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#C8C8C8" text-anchor="start">generate() → budget → queue → HTTP / SSE</text>
<rect x="1000" y="334" width="380" height="112" rx="16" fill="#2C2C2C" stroke="#363636" stroke-width="2"/>
<text x="1024" y="372" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="650" fill="#C8C8C8" text-anchor="start">API model endpoint</text>
<text x="1024" y="408" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#C8C8C8" text-anchor="start">Local or external profile</text>
<rect x="438" y="478" width="500" height="112" rx="16" fill="#2C2C2C" stroke="#363636" stroke-width="2"/>
<text x="462" y="516" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="650" fill="#C8C8C8" text-anchor="start">Coder / reviewer CLI</text>
<text x="462" y="552" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#C8C8C8" text-anchor="start">Template + overlay → detected vendor CLI</text>
<rect x="1000" y="478" width="380" height="112" rx="16" fill="#2C2C2C" stroke="#363636" stroke-width="2"/>
<text x="1024" y="516" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="650" fill="#C8C8C8" text-anchor="start">Vendor cloud account</text>
<text x="1024" y="552" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#C8C8C8" text-anchor="start">Ambient or keyed auth home</text>
<rect x="438" y="622" width="500" height="112" rx="16" fill="#2C2C2C" stroke="#363636" stroke-width="2"/>
<text x="462" y="660" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="650" fill="#C8C8C8" text-anchor="start">CLI Shim</text>
<text x="462" y="696" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#C8C8C8" text-anchor="start">Replaces local model server</text>
<rect x="1000" y="622" width="380" height="112" rx="16" fill="#2C2C2C" stroke="#363636" stroke-width="2"/>
<text x="462" y="724" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="400" fill="#C8C8C8" text-anchor="start">Same model contract → cloud inference</text>
<text x="1024" y="660" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="650" fill="#C8C8C8" text-anchor="start">Subscription cloud</text>
<text x="1024" y="696" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#C8C8C8" text-anchor="start">One selected identity</text>
<path d="M220 290 V334" fill="none" stroke="#3A95AB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M380 370 H438" fill="none" stroke="#3A95AB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
