<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc"><title id="title">One skill definition, four native packages</title><desc id="desc">One canonical skill definition is emitted into four native package formats. Packages live around one CLI invocation; templates and model overlays remain separate.</desc>
