<text x="50" y="65" fill="#7AA2F7" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="600">One procedure. Four native skill packages.</text>
<text x="50" y="104" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400">Seat templates set role contracts. Native skill packages carry reusable procedures.</text>
